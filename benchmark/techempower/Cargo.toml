[package]
name = "potato-tfb"
version = "0.1.0"
edition = "2021"
publish = false

# 独立构建：同 ../，声明空 [workspace] 脱离仓库 workspace，
# 依赖走 crates.io，保证与 TFB 容器内构建一致
[workspace]

[dependencies]
# potato 宏展开内部引用 anyhow，消费端需保证其可见
anyhow = "1"
potato = { version = "0.4.6", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
