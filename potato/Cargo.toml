[package]
name = "potato"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fawdlstty/potato"
homepage = "https://github.com/fawdlstty/potato"
description = "A very simple and high performance http library."
authors = ["fawdlstty<f@fawdlstty.com>"]
keywords = ["http", "web"]
categories = []
readme = "../README.md"
exclude = ["src/main.rs"]

[dependencies]
anyhow = { version = "1.0.104", optional = true, default-features = false }
async-recursion = { version = "1.1.1", optional = true }
async-trait = { version = "0.1.92", optional = true }
base64 = { version = "0.23.1", optional = true, default-features = false }
chrono = { version = "0.4.45", optional = true }
flate2 = { version = "1.1.10", optional = true }
http = { version = "1.5.0", optional = true }
httparse = { version = "1.10.1", optional = true }
inventory = { version = "0.3.24", optional = true }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"], optional = true }
potato-macro = { version = "0.3.29", path = "../potato-macro" }
linkme = { version = "0.3.37" }
rand = { version = "0.10.2", optional = true }
rustc-hash = { version = "2.1.1", optional = true }
regex = { version = "1.13.1", optional = true }
rust-embed = { version = "8.12.0", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true, default-features = false }
sha1 = { version = "0.11.0", optional = true, default-features = false }
smallstr = { version = "0.3.1", optional = true }
smallvec = { version = "1.15.2", optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1.0.9", optional = true }

# ssh
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
# webdav
bytes = { version = "1.12.1", optional = true }
dav-server = { version = "0.11.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
hipstr = { version = "0.8.0", optional = true }
thread_local = { version = "1.1.10", optional = true }
dashmap = { version = "6.2.1", optional = true }
# http2
h2 = { version = "0.4.19", optional = true }
# http3
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.14.10", optional = true }
# acme
instant-acme = { version = "0.8.5", default-features = true, features = ["ring"], optional = true }
x509-parser = { version = "0.18.1", optional = true }
# webrtc
webrtc = { version = "0.20.3", optional = true }
rtc = { version = "0.20.3", optional = true }
uuid = { version = "1.26.0", features = ["v4"], optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# jemalloc
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }
tikv-jemalloc-sys = { version = "0.7.0", features = [
    "profiling",
    "stats",
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
], optional = true }
tikv-jemallocator = { version = "0.7.0", features = [
    "profiling",
    "stats",
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
], optional = true }

[dev-dependencies]
rcgen = "0.14.5"
time = "0.3.55"

[features]
default = ["std", "websocket", "openapi", "tls"]
std = [
    "potato-macro/std",
    "dep:anyhow",
    "anyhow/std",
    "dep:base64",
    "base64/std",
    "dep:async-recursion",
    "dep:async-trait",
    "dep:chrono",
    "dep:flate2",
    "dep:http",
    "dep:httparse",
    "dep:inventory",
    "dep:jsonwebtoken",
    "dep:rand",
    "dep:rustc-hash",
    "dep:regex",
    "dep:rust-embed",
    "dep:serde",
    "dep:serde_json",
    # std-only 构建同样编译 full.rs 的 websocket 升级路径（from_websocket
    # 使用 sha1），故 sha1 随 std 启用；websocket feature 因此只剩 dep:anyhow
    # 的增量作用
    "dep:sha1",
    "dep:sha2",
    "dep:smallstr",
    "dep:smallvec",
    "dep:strum",
    "dep:tokio",
    "dep:hipstr",
    "dep:thread_local",
    "dep:dashmap",
]
websocket = ["dep:anyhow", "dep:sha1"]
http2 = ["std", "tls", "dep:h2", "dep:bytes"]
http3 = ["std", "tls", "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:bytes", "dep:rcgen"]
webtransport = ["http3"]
jemalloc = ["std", "dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys", "dep:tikv-jemallocator"]
openapi = ["std"]
ssh = ["std", "dep:russh"]
tls = ["std", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:webpki-roots"]
webdav = ["std", "dep:bytes", "dep:dav-server", "dep:futures-util", "dep:webpki-roots"]
acme = ["std", "tls", "dep:instant-acme", "dep:x509-parser"]
webrtc = ["std", "dep:webrtc", "dep:rtc", "dep:uuid", "dep:bytes", "tls"]
full = ["std", "websocket", "openapi", "ssh", "tls", "http2", "http3", "webdav", "acme", "webrtc"]

# cargo publish -p potato-macro --allow-dirty --registry crates-io
# cargo publish -p potato --allow-dirty --registry crates-io
# cd docs && npm run docs:build && cd ..
