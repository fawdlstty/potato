[package]
name = "potato-macro"
version = "0.3.28"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fawdlstty/potato"
homepage = "https://github.com/fawdlstty/potato"
description = "A very simple and high performance http library."
keywords = ["http", "web"]
categories = []
readme = "../README.md"

[features]
default = []
std = []

[dependencies]
chrono = "0.4.45"
inventory = "0.3.24"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.2"
serde_json = "1.0.151"
syn = { version = "3.0.4", features = ["full"] }

[lib]
proc-macro = true
